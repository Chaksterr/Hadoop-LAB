---
- name: Base OS setup (Java, hadoop user, SSH, /etc/hosts)
  hosts: hadoop_cluster
  become: yes
  roles:
    - common

- name: Install and configure Hadoop on every node
  hosts: hadoop_cluster
  become: yes
  roles:
    - hadoop

- name: Format the NameNode (master only, first run only)
  hosts: masters
  become: yes
  roles:
    - format_master

- name: Install MySQL server and create Hive metastore database
  hosts: masters
  become: yes
  roles:
    - mysql

- name: Install and configure Apache Hive (master only)
  hosts: masters
  become: yes
  roles:
    - hive

- import_playbook: start_cluster.yml

# Cluster is now installed, configured, and formatted.
# Start it (first time and every time after) with:
#   ansible-playbook -i inventory.ini start_cluster.yml