---
- name: Base OS setup (Java, hadoop user, SSH, /etc/hosts)
  hosts: hadoop_cluster
  become: yes
  roles:
    - common

- name: Install and configure Hadoop on every node
  hosts: hadoop_cluster
  become: yes
  roles:
    - hadoop

- name: Format the NameNode (master only, first run only)
  hosts: masters
  become: yes
  roles:
    - format_master

- name: Install MySQL server and create Hive metastore database
  hosts: masters
  become: yes
  roles:
    - mysql

- name: Install and configure Apache Hive (master only)
  hosts: masters
  become: yes
  roles:
    - hive

- name: Install the ZooKeeper quorum (shared by Hive HA and HBase HA)
  hosts: zookeepers
  become: yes
  roles:
    - zookeeper

- name: Install and configure HBase in high availability (every node)
  hosts: hadoop_cluster
  become: yes
  roles:
    - hbase

- name: Install Kafka brokers (ZooKeeper mode, shared quorum)
  hosts: kafka_brokers
  become: yes
  roles:
    - kafka

- name: Install Jupyter and the INGTopic streaming notebook (master only)
  hosts: masters
  become: yes
  roles:
    - jupyter

- import_playbook: start_cluster.yml

# Cluster is now installed, configured, and formatted.
# Start it (first time and every time after) with:
#   ansible-playbook -i inventory.ini start_cluster.yml
# Kafka streaming lab (only ZooKeeper + Kafka, no HDFS/HBase needed):
#   ansible-playbook -i inventory.ini start_kafka.yml