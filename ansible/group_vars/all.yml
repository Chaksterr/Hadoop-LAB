---
# Java configuration
java_version: "8"
java_home: "/usr/lib/jvm/java-{{ java_version }}-openjdk-amd64"

# Hadoop configuration
hadoop_version: "3.3.6"
hadoop_user: "hadoop"
hadoop_install_dir: "/home/hadoop"
hadoop_home: "{{ hadoop_install_dir }}/hadoop"
hadoop_mirror: "https://archive.apache.org/dist/hadoop/common/hadoop-{{ hadoop_version }}/hadoop-{{ hadoop_version }}.tar.gz"

namenode_host: "master"
namenode_port: "9000"
dfs_replication: 2

hdfs_namenode_dir: "{{ hadoop_install_dir }}/data/namenode"
hdfs_datanode_dir: "{{ hadoop_install_dir }}/data/datanode"

resourcemanager_host: "master"

# Hive  & MySQL configuration
mysql_root_password: "root"
mysql_host: "localhost"
hive_metastore_db: "hivedb"
hive_metastore_user: "hive"
hive_metastore_password: "hive"

hive_version: "3.1.3"
hive_home: "{{ hadoop_install_dir }}/hive"
hive_mirror: "https://archive.apache.org/dist/hive/hive-{{ hive_version }}/apache-hive-{{ hive_version }}-bin.tar.gz"
mysql_connector_version: "8.0.33"
mysql_connector_url: "https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/{{ mysql_connector_version }}/mysql-connector-j-{{ mysql_connector_version }}.jar"
hive_metastore_host: "master"
hive_metastore_port: 9083
hiveserver2_port: 10000

# HBase configuration
hbase_version: "2.5.12"
hbase_home: "{{ hadoop_install_dir }}/hbase"

# ZooKeeper (quorum de 3 noeuds, partage par Hive HA et HBase HA)
zookeeper_version: "3.8.3"
zookeeper_home: "{{ hadoop_install_dir }}/zookeeper"
zookeeper_data_dir: "{{ zookeeper_home }}/data"
zookeeper_mirror: "https://archive.apache.org/dist/zookeeper/zookeeper-{{ zookeeper_version }}/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
zookeeper_client_port: 2181

# HBase HA (HMaster actif sur master, HMaster de secours sur les hotes du groupe hbase_backup_masters)
hbase_mirror: "https://archive.apache.org/dist/hbase/{{ hbase_version }}/hbase-{{ hbase_version }}-hadoop3-bin.tar.gz"
hbase_rootdir: "hdfs://{{ namenode_host }}:{{ namenode_port }}/hbase"
hbase_tmp_dir: "{{ hadoop_install_dir }}/tmp/hbase"
hbase_zk_session_timeout: 30000
hbase_master_heap: "-Xms512m -Xmx1g"
hbase_regionserver_heap: "-Xms512m -Xmx768m"
