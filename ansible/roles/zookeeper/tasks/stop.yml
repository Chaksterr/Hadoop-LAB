---
# roles/zookeeper/tasks/stop.yml
# Arrete ZooKeeper sur l'hote courant (a faire en dernier, apres HBase et Hive).

- name: Stop ZooKeeper
  shell: "{{ zookeeper_home }}/bin/zkServer.sh stop"
  environment:
    JAVA_HOME: "{{ java_home }}"
  register: zk_stop
  changed_when: "'STOPPED' in zk_stop.stdout"
  failed_when: false
