---
# roles/zookeeper/tasks/main.yml
# Installe un quorum ZooKeeper autonome sur les hotes du groupe [zookeepers].
# Ce quorum est partage par Hive HA (/hiveserver2) et HBase HA (/hbase).
# myid = position de l'hote dans le groupe : master=1, datanode1=2, datanode2=3.

- name: Download ZooKeeper {{ zookeeper_version }} tarball
  get_url:
    url: "{{ zookeeper_mirror }}"
    dest: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    timeout: 300
  register: zk_dl
  retries: 3
  delay: 10
  until: zk_dl is succeeded

- name: Extract ZooKeeper
  unarchive:
    src: "/tmp/apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz"
    dest: "{{ hadoop_install_dir }}"
    remote_src: yes
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"
    creates: "{{ hadoop_install_dir }}/apache-zookeeper-{{ zookeeper_version }}-bin"

# Sur le cluster existant, ~/zookeeper est deja un vrai dossier (installe a la main) :
# on ne cree le lien que s'il n'existe rien a cet endroit.
- name: Check whether {{ zookeeper_home }} already exists
  stat:
    path: "{{ zookeeper_home }}"
  register: zk_home

- name: Symlink zookeeper_home
  file:
    src: "{{ hadoop_install_dir }}/apache-zookeeper-{{ zookeeper_version }}-bin"
    dest: "{{ zookeeper_home }}"
    state: link
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"
  when: not zk_home.stat.exists

- name: Create ZooKeeper data directory
  file:
    path: "{{ zookeeper_data_dir }}"
    state: directory
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"
    mode: "0755"

- name: Deploy zoo.cfg (quorum of {{ groups['zookeepers'] | length }} nodes)
  template:
    src: zoo.cfg.j2
    dest: "{{ zookeeper_home }}/conf/zoo.cfg"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"

- name: Write myid ({{ groups['zookeepers'].index(inventory_hostname) + 1 }} on {{ inventory_hostname }})
  copy:
    dest: "{{ zookeeper_data_dir }}/myid"
    content: "{{ groups['zookeepers'].index(inventory_hostname) + 1 }}\n"
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"

- name: Add ZooKeeper environment variables to .bashrc
  blockinfile:
    path: "{{ hadoop_install_dir }}/.bashrc"
    marker: "# {mark} ZOOKEEPER ENV"
    block: |
      export ZOOKEEPER_HOME={{ zookeeper_home }}
      export PATH=$PATH:$ZOOKEEPER_HOME/bin
    owner: "{{ hadoop_user }}"
    group: "{{ hadoop_user }}"
