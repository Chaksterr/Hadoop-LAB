[masters]
master ansible_host=192.168.56.10

[datanodes]
datanode1 ansible_host=192.168.56.12
datanode2 ansible_host=192.168.56.13

[hadoop_cluster:children]
masters
datanodes

# Quorum ZooKeeper (nombre impair) : myid = ordre dans ce groupe
[zookeepers]
master
datanode1
datanode2

# HMaster de secours (HBase HA) ; le HMaster actif est sur master
[hbase_backup_masters]
datanode1

# Brokers Kafka : broker.id = ordre dans ce groupe (master=1, datanode1=2, datanode2=3)
[kafka_brokers]
master
datanode1
datanode2

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3