---
# ansible/start_cluster.yml
# Run whenever you want to bring the cluster up (e.g. after `vagrant up`
# on an already-provisioned cluster, or after `vagrant halt` + `vagrant up`).
#
# Usage:
#   cd ansible
#   ansible-playbook start_cluster.yml

- name: Start Hadoop cluster
  hosts: master
  become: yes
  become_user: "{{ hadoop_user }}"
  environment:
    JAVA_HOME: "/usr/lib/jvm/java-{{ java_version }}-openjdk-amd64"
    HADOOP_HOME: "{{ hadoop_home }}"
    HADOOP_CONF_DIR: "{{ hadoop_home }}/etc/hadoop"
  tasks:

    - name: Start HDFS (NameNode + DataNodes)
      shell: "{{ hadoop_home }}/sbin/start-dfs.sh"

    - name: Start YARN (ResourceManager + NodeManagers)
      shell: "{{ hadoop_home }}/sbin/start-yarn.sh"

    - name: Start JobHistory server
      shell: "{{ hadoop_home }}/bin/mapred --daemon start historyserver"

    - name: Create Hive HDFS directories (first run only)
      shell: |
        {{ hadoop_home }}/bin/hdfs dfs -mkdir -p /user/hive/warehouse
        {{ hadoop_home }}/bin/hdfs dfs -mkdir -p /tmp/hive
        {{ hadoop_home }}/bin/hdfs dfs -chmod 777 /user/hive/warehouse
        {{ hadoop_home }}/bin/hdfs dfs -chmod 777 /tmp/hive
        touch {{ hadoop_install_dir }}/.hive_hdfs_dirs_created
      environment:
        HADOOP_HOME: "{{ hadoop_home }}"
      args:
        creates: "{{ hadoop_install_dir }}/.hive_hdfs_dirs_created"

    - name: Start Hive Metastore
      shell: "nohup {{ hive_home }}/bin/hive --service metastore > {{ hadoop_install_dir }}/hive-metastore.log 2>&1 &"
      args:
        chdir: "{{ hadoop_install_dir }}"
      environment:
        HIVE_HOME: "{{ hive_home }}"
        HADOOP_HOME: "{{ hadoop_home }}"

    - name: Wait for Hive Metastore to start
      pause:
        seconds: 10

    - name: Start HiveServer2
      shell: "nohup {{ hive_home }}/bin/hive --service hiveserver2 > {{ hadoop_install_dir }}/hiveserver2.log 2>&1 &"
      args:
        chdir: "{{ hadoop_install_dir }}"
      environment:
        HIVE_HOME: "{{ hive_home }}"
        HADOOP_HOME: "{{ hadoop_home }}"

    - name: Wait for daemons to settle
      pause:
        seconds: 10

- name: Check Hadoop daemons on all nodes
  hosts: hadoop_cluster
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:

    - name: Show running Java processes on {{ inventory_hostname }}
      shell: "jps"
      register: jps_out

    - name: Print jps output for {{ inventory_hostname }}
      debug:
        msg: "{{ inventory_hostname }}: {{ jps_out.stdout_lines }}"
