---
# ansible/stop_cluster.yml
# Run whenever you want to shut the cluster down cleanly
# (e.g. before `vagrant halt`).
#
# Usage:
#   cd ansible
#   ansible-playbook stop_cluster.yml

- name: Make sure the ZooKeeper quorum is up (HBase needs it to shut down cleanly)
  hosts: zookeepers
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Start ZooKeeper if needed
      include_role:
        name: zookeeper
        tasks_from: start

- name: Stop Hadoop cluster
  hosts: master
  become: yes
  become_user: "{{ hadoop_user }}"
  environment:
    JAVA_HOME: "/usr/lib/jvm/java-{{ java_version }}-openjdk-amd64"
    HADOOP_HOME: "{{ hadoop_home }}"
    HADOOP_CONF_DIR: "{{ hadoop_home }}/etc/hadoop"
  tasks:

    # ---------------------------------------------------------------------
    # HBase must stop BEFORE HDFS, otherwise data still in MemStore is lost.
    #
    # We do NOT use stop-hbase.sh: in HBase 2.5.12 its waitForProcessEnd looks
    # for 'proc_stop-master-command' while the master runs as '-Dproc_master',
    # so it never waits. It then stops ZooKeeper while the master is still
    # shutting down -> the master can't set the "cluster down" flag in ZK,
    # RegionServers never get the signal, and everything hangs.
    # So: ZK up -> ask cluster to shut down -> wait for exit -> THEN stop ZK.
    # ZooKeeper is now an external quorum (roles/zookeeper): it is started
    # by the first play and stopped by the last one, after Hive and HDFS.
    # ---------------------------------------------------------------------
    - name: Check whether HBase is installed
      stat:
        path: "{{ hbase_home }}/bin/hbase"
      register: hbase_installed

    - name: Check whether an HMaster is running
      shell: "pgrep -f -- '-Dproc_[m]aster'"   # [m] so it doesn't match this shell itself
      register: hmaster_running
      when: hbase_installed.stat.exists
      failed_when: false
      changed_when: false

    - name: Ask HBase to shut down the cluster (RegionServers flush + exit, then HMaster)
      shell: "timeout 120 {{ hbase_home }}/bin/hbase master stop --shutDownCluster"
      environment:
        HBASE_HOME: "{{ hbase_home }}"
      when: hbase_installed.stat.exists and hmaster_running.rc == 0
      ignore_errors: yes

    - name: Wait until HMaster and RegionServers have exited
      shell: |
        for i in $(seq 1 60); do
          alive=0
          for h in {{ groups['hadoop_cluster'] | join(' ') }}; do
            ssh -q $h "$JAVA_HOME/bin/jps" | grep -qE 'HMaster|HRegionServer' && alive=1
          done
          [ $alive -eq 0 ] && exit 0
          sleep 2
        done
        exit 1
      register: hbase_wait
      when: hbase_installed.stat.exists
      failed_when: false
      changed_when: false

    - name: Force-stop leftover HBase daemons (SIGTERM, only if still alive after 2 min)
      shell: |
        for h in {{ groups['hadoop_cluster'] | join(' ') }}; do
          ssh -q $h "pkill -TERM -f 'org.apache.hadoop.hbase.(master.HMaster|regionserver.HRegionServer|zookeeper.HQuorumPeer)'"
        done
        sleep 10
      when: hbase_installed.stat.exists and hbase_wait.rc | default(0) != 0
      ignore_errors: yes

    - name: Stop HiveServer2
      shell: "pkill -9 -f 'org.apache.hive.service.server.HiveServer2'"
      ignore_errors: yes
      failed_when: false

    - name: Stop Hive Metastore
      shell: "pkill -9 -f 'hive.*metastore'"
      ignore_errors: yes
      failed_when: false

    - name: Stop JobHistory server
      shell: "{{ hadoop_home }}/bin/mapred --daemon stop historyserver"
      ignore_errors: yes

    - name: Stop YARN (ResourceManager + NodeManagers)
      shell: "{{ hadoop_home }}/sbin/stop-yarn.sh"
      ignore_errors: yes

    - name: Stop HDFS (NameNode + DataNodes)
      shell: "{{ hadoop_home }}/sbin/stop-dfs.sh"
      ignore_errors: yes

- name: Stop the ZooKeeper quorum (last, after HBase and Hive are gone)
  hosts: zookeepers
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:
    - name: Stop ZooKeeper
      include_role:
        name: zookeeper
        tasks_from: stop

- name: Check all nodes are stopped
  hosts: hadoop_cluster
  become: yes
  become_user: "{{ hadoop_user }}"
  tasks:

    - name: Confirm nothing Hadoop-related is still running on {{ inventory_hostname }}
      shell: "jps"
      register: jps_out

    - name: Print jps output for {{ inventory_hostname }} (should only show 'Jps' itself)
      debug:
        msg: "{{ inventory_hostname }}: {{ jps_out.stdout_lines }}"
